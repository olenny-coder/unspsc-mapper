<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="UNSPSC Spend Categorizer — classify procurement spend into UNSPSC codes">
  <title>UNSPSC Spend Categorizer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent bar, echoing the container radius of the logo -->
  <rect x="0" y="0" width="1200" height="8" fill="#2563eb"/>

  <!-- Brand mark: rounded container with three ascending rounded bars.
       Geometry mirrors public/icon.svg (64x64) scaled to 132px. -->
  <g transform="translate(80 70) scale(2.0625)">
    <rect width="64" height="64" rx="15" fill="url(#mark)"/>
    <g fill="#ffffff">
      <rect x="14" y="34" width="9" height="17" rx="4.5"/>
      <rect x="27.5" y="26" width="9" height="25" rx="4.5"/>
    </g>
    <rect x="41" y="16" width="9" height="35" rx="4.5" fill="#bfdbfe"/>
  </g>

  <text x="248" y="118" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#93c5fd">UNSPSC Spend Categorizer</text>
  <text x="248" y="150" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">Procurement spend → 8-digit UNSPSC commodity codes</text>

  <!-- Headline -->
  <text x="80" y="248" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">Classify spend automatically.</text>
  <text x="80" y="312" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">Roll it up by parent company.</text>

  <!-- Feature chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">
    <rect x="80" y="360" width="286" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="108" y="390">Hybrid enrichment + LLM</text>

    <rect x="386" y="360" width="318" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="414" y="390">Parent / subsidiary mapping</text>

    <rect x="724" y="360" width="268" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="752" y="390">Human review queue</text>

    <rect x="80" y="422" width="286" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="108" y="452">CSV and PDF reporting</text>

    <rect x="386" y="422" width="318" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="414" y="452">Live supplier sync + audit log</text>

    <rect x="724" y="422" width="268" height="46" rx="23" fill="#1e293b" stroke="#334155"/>
    <text x="752" y="452">Free-tier deployable</text>
  </g>

  <!-- Stack line -->
  <text x="80" y="536" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#64748b">Next.js 14 · Drizzle · Neon Postgres · Groq Llama 3.3 · Render worker · Vercel</text>
  <text x="80" y="572" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#475569">149,849 UNSPSC v26 codes seeded · MIT licensed · independent, not affiliated with UNDP</text>

  <!-- Decorative rounded bars, echoing the segment breakdown chart -->
  <g fill="#2563eb" opacity="0.85">
    <rect x="1010" y="430" width="26" height="24" rx="7"/>
    <rect x="1046" y="392" width="26" height="62" rx="7"/>
    <rect x="1082" y="352" width="26" height="102" rx="7"/>
    <rect x="1118" y="300" width="26" height="154" rx="7"/>
  </g>
</svg>
