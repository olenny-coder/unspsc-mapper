<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UNSPSC Spend Categorizer">
  <title>UNSPSC Spend Categorizer</title>
  <defs>
    <linearGradient id="mm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Maskable: the mark is inset into the central 80% safe zone so Android can
       crop it to a circle or squircle without clipping the bars. -->
  <rect width="64" height="64" fill="url(#mm)"/>
  <g fill="#ffffff">
    <rect x="17" y="35" width="7.5" height="13" rx="3.75"/>
    <rect x="28.25" y="28.5" width="7.5" height="19.5" rx="3.75"/>
  </g>
  <g fill="#bfdbfe">
    <rect x="39.5" y="20.5" width="7.5" height="27.5" rx="3.75"/>
  </g>
</svg>
