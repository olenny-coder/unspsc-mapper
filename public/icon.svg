<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="UNSPSC Spend Categorizer">
  <title>UNSPSC Spend Categorizer</title>
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Rounded container -->
  <rect width="64" height="64" rx="15" fill="url(#m)"/>

  <!-- Three ascending rounded bars: spend rolled up and classified.
       Bars are visually equal weight but differ in accent so the tallest reads
       as the "resolved" value. -->
  <g fill="#ffffff">
    <rect x="14" y="34" width="9" height="17" rx="4.5"/>
    <rect x="27.5" y="26" width="9" height="25" rx="4.5"/>
  </g>
  <g fill="#bfdbfe">
    <rect x="41" y="16" width="9" height="35" rx="4.5"/>
  </g>
</svg>
